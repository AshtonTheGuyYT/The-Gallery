<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
    transition: background 0.6s ease;
  }

  body { background: #05060a; }

  /* ---------- shared aurora layer ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    transition: opacity 0.6s ease;
    background:
      radial-gradient(circle at 20% 30%, var(--glow-a, rgba(64,120,255,0.35)), transparent 45%),
      radial-gradient(circle at 80% 70%, var(--glow-b, rgba(255,80,160,0.35)), transparent 45%),
      #05060a;
    animation: drift 14s ease-in-out infinite alternate;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at center, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 75%);
  }
  @keyframes drift {
    0%   { transform: scale(1)   translate(0, 0); }
    100% { transform: scale(1.15) translate(-2%, 2%); }
  }

  /* ---------- views ---------- */
  .view { position: relative; z-index: 1; display: none; height: 100%; width: 100%; }
  .view.active { display: flex; }

  /* ---------- landing ---------- */
  #landing { align-items: center; justify-content: center; }

  .card {
    padding: 56px 64px;
    border-radius: 24px;
    background: rgba(15, 18, 30, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    text-align: center;
    max-width: 620px;
    width: 92vw;
  }

  h1 {
    font-size: clamp(22px, 3.4vw, 34px);
    font-weight: 600;
    margin-bottom: 40px;
    background: linear-gradient(90deg, #6aa8ff, #ff6ab0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .buttons { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }

  button {
    flex: 1 1 150px;
    min-width: 140px;
    padding: 18px 22px;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
  }
  button:hover { transform: translateY(-3px); filter: brightness(1.1); }
  button:active { transform: translateY(0) scale(0.98); }

  .male   { background: linear-gradient(135deg, #2563eb, #3b82f6); box-shadow: 0 10px 30px rgba(59,130,246,0.45); }
  .female { background: linear-gradient(135deg, #db2777, #f472b6); box-shadow: 0 10px 30px rgba(244,114,182,0.45); }
  .femboy { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #f472b6 100%); box-shadow: 0 10px 30px rgba(168,85,247,0.45); }

  /* ---------- loading ---------- */
  #loading { align-items: center; justify-content: center; flex-direction: column; gap: 24px; }

  .spinner {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 5px solid rgba(255,255,255,0.12);
    border-top-color: #6aa8ff;
    border-right-color: #ff6ab0;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #6aa8ff, #ff6ab0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; }

  .gallery-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 34px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .gallery-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: capitalize;
  }

  .back-btn {
    flex: 0 0 auto;
    min-width: 0;
    padding: 10px 20px;
    font-size: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: none;
  }
  .back-btn:hover { background: rgba(255,255,255,0.16); }

  .gallery-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 30px 34px 60px;
  }
  .gallery-scroll::-webkit-scrollbar { width: 10px; }
  .gallery-scroll::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .grid img,
  .grid video {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.25s ease;
  }
  .grid img:hover,
  .grid video:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.55);
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: rgba(255,255,255,0.45);
    font-size: 15px;
  }

  /* ---------- fullscreen viewer ---------- */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: fadeIn 0.2s ease;
  }
  .viewer.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .viewer img,
  .viewer video {
    max-width: 82vw;
    max-height: 88vh;
    border-radius: 12px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.8);
    background: #000;
  }

  .viewer-close {
    position: absolute;
    top: 22px;
    right: 26px;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 12px;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background 0.2s ease, transform 0.15s ease;
    z-index: 101;
    flex: 0 0 auto;
    min-width: 0;
  }
  .viewer-close:hover  { background: rgba(255,255,255,0.20); transform: translateY(-2px); }
  .viewer-close:active { transform: translateY(0) scale(0.97); }

  /* prev / next arrows */
  .viewer-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 60px;
    padding: 0;
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    color: #fff;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
    z-index: 101;
    flex: 0 0 auto;
    min-width: 0;
    user-select: none;
  }
  .viewer-arrow:hover  { background: rgba(255,255,255,0.22); }
  .viewer-arrow:active { transform: translateY(-50%) scale(0.94); }

  .viewer-arrow.left  { left: 26px; }
  .viewer-arrow.right { right: 26px; }

  .viewer-arrow.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .viewer-counter {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 18px;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.75);
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 101;
    flex: 0 0 auto;
    min-width: 0;
  }

  /* per-gallery bg colors set on <body> via JS */
</style>
</head>
<body>

  <div class="bg" id="bg"></div>

  <!-- LANDING -->
  <div class="view active" id="landing">
    <div class="card">
      <h1>What gallery content would you like?</h1>
      <div class="buttons">
        <button class="male"   onclick="choose('male')">Vanilla</button>
        <button class="female" onclick="choose('female')">Females Only</button>
        <button class="femboy" onclick="choose('femboy')">Femboys Only</button>
      </div>
    </div>
  </div>

  <!-- LOADING -->
  <div class="view" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>

  <!-- GALLERY -->
  <div class="view" id="gallery">
    <div class="gallery-header">
      <div class="gallery-title" id="gallery-title"></div>
      <button class="back-btn" onclick="reset()">&larr; back</button>
    </div>
    <div class="gallery-scroll">
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none;">No files in this gallery yet.</div>
    </div>
  </div>

  <!-- FULLSCREEN VIEWER -->
  <div class="viewer" id="viewer">
    <button class="viewer-close" onclick="closeViewer()">&times; back</button>

    <button class="viewer-arrow left"  id="viewer-prev" onclick="prevItem()">&lsaquo;</button>
    <button class="viewer-arrow right" id="viewer-next" onclick="nextItem()">&rsaquo;</button>

    <img   id="viewer-img"   src="" alt="" style="display:none;">
    <video id="viewer-video" src="" controls playsinline style="display:none;"></video>

    <div class="viewer-counter" id="viewer-counter"></div>
  </div>

<script>
/* ============================================================
   FOLDER LISTS
   ------------------------------------------------------------
   Browsers can't list folders on their own. Either:
   (A) fill these arrays manually with filenames, OR
   (B) run the tiny server at the bottom of this file and it
       will populate these automatically from disk.

   Files go in:  /malegallery/  /femalegallery/  /femboygallery/
   ============================================================ */
const GALLERIES = {
  male:   { folder: "malegallery",   files: [] /* e.g. ["1.jpg","2.png","clip.mp4"] */ },
  female: { folder: "femalegallery", files: [] },
  femboy: { folder: "femboygallery", files: [] }
};

/* per-gallery theme (body bg + aurora glow colors) */
const THEMES = {
  male:   { body: "#040a1c", a: "rgba(64,140,255,0.45)", b: "rgba(30,90,220,0.35)" },
  female: { body: "#1a0416", a: "rgba(255,80,170,0.45)", b: "rgba(220,40,140,0.35)" },
  femboy: { body: "#120424", a: "rgba(120,90,255,0.45)", b: "rgba(255,90,190,0.40)" }
};

const VIDEO_EXT = ["mp4","webm","ogg","mov","m4v"];

/* viewer state */
let currentFiles = [];   // names of the currently displayed gallery
let currentFolder = "";  // folder prefix for the currently displayed gallery
let currentIndex = -1;   // which item the viewer is showing

function isVideo(name) {
  const ext = name.split(".").pop().toLowerCase();
  return VIDEO_EXT.includes(ext);
}

function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function choose(kind) {
  showView("loading");

  // set the theme during loading so the background morphs behind the spinner
  const t = THEMES[kind];
  document.body.style.background = t.body;
  const bg = document.getElementById("bg");
  bg.style.setProperty("--glow-a", t.a);
  bg.style.setProperty("--glow-b", t.b);

  // fake load time so the "Loading..." is felt
  setTimeout(() => {
    renderGallery(kind);
    showView("gallery");
  }, 1200);
}

async function renderGallery(kind) {
  const g = GALLERIES[kind];
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  document.getElementById("gallery-title").textContent = g.folder;

  let files = [];
  try {
    const r = await fetch(`list.php?folder=${g.folder}`);
    files = await r.json();
  } catch (e) {
    files = g.files; // fall back to hardcoded list
  }

  // remember for the viewer
  currentFiles = files;
  currentFolder = g.folder;
  currentIndex = -1;

  grid.innerHTML = "";

  if (!files.length) {
    empty.style.display = "block";
    empty.textContent = "No files in /" + g.folder + " yet.";
    return;
  }
  empty.style.display = "none";

  for (let i = 0; i < files.length; i++) {
    const name = files[i];
    const src = g.folder + "/" + name;
    let el;
    if (isVideo(name)) {
      el = document.createElement("video");
      el.src = src;
      el.muted = true;
      el.loop = true;
      el.playsInline = true;
      el.addEventListener("mouseenter", () => el.play().catch(()=>{}));
      el.addEventListener("mouseleave", () => { el.pause(); el.currentTime = 0; });
      el.addEventListener("click", () => openViewer(i));
    } else {
      el = document.createElement("img");
      el.src = src;
      el.alt = name;
      el.loading = "lazy";
      el.addEventListener("click", () => openViewer(i));
    }
    grid.appendChild(el);
  }
}

function openViewer(index) {
  currentIndex = index;
  renderViewerItem();
  document.getElementById("viewer").classList.add("active");
}

function renderViewerItem() {
  const img  = document.getElementById("viewer-img");
  const vid  = document.getElementById("viewer-video");
  const prev = document.getElementById("viewer-prev");
  const next = document.getElementById("viewer-next");
  const counter = document.getElementById("viewer-counter");

  const name = currentFiles[currentIndex];
  const src  = currentFolder + "/" + name;
  const isVid = isVideo(name);

  // reset both, then show the right one
  img.style.display = "none";
  vid.style.display = "none";
  img.src = "";
  vid.pause();
  vid.src = "";

  if (isVid) {
    vid.src = src;
    vid.style.display = "block";
    vid.play().catch(()=>{});
  } else {
    img.src = src;
    img.style.display = "block";
  }

  // boundary-aware arrows
  prev.classList.toggle("hidden", currentIndex <= 0);
  next.classList.toggle("hidden", currentIndex >= currentFiles.length - 1);

  // counter
  counter.textContent = (currentIndex + 1) + " / " + currentFiles.length;
}

function prevItem() {
  if (currentIndex > 0) {
    currentIndex--;
    renderViewerItem();
  }
}

function nextItem() {
  if (currentIndex < currentFiles.length - 1) {
    currentIndex++;
    renderViewerItem();
  }
}

function closeViewer() {
  const img = document.getElementById("viewer-img");
  const vid = document.getElementById("viewer-video");
  vid.pause();
  vid.src = "";
  img.src = "";
  document.getElementById("viewer").classList.remove("active");
  currentIndex = -1;
}

document.addEventListener("keydown", e => {
  const viewerOpen = document.getElementById("viewer").classList.contains("active");

  if (e.key === "Escape") {
    if (viewerOpen) closeViewer();
    return;
  }

  if (!viewerOpen) return;

  if (e.key === "ArrowLeft")  { e.preventDefault(); prevItem(); }
  if (e.key === "ArrowRight") { e.preventDefault(); nextItem(); }
});

function reset() {
  // fade back to neutral
  document.body.style.background = "#05060a";
  const bg = document.getElementById("bg");
  bg.style.setProperty("--glow-a", "rgba(64,120,255,0.35)");
  bg.style.setProperty("--glow-b", "rgba(255,80,160,0.35)");

  document.getElementById("grid").innerHTML = "";
  closeViewer();
  currentFiles = [];
  currentFolder = "";
  currentIndex = -1;
  showView("landing");
}
</script>
</body>
</html>
